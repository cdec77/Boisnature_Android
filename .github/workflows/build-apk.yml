name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-l-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name:: Bois 낯 Nature Photos-APK
          path:: app/build/outputs/apk/debug/appgradebug.apk
